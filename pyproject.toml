[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microlm"
version = "1.0.0"
description = "A controlled ablation study of small transformer language models."
authors = [{ name = "Vraj Detroja" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy", "regex", "pyyaml", "tqdm"]

[project.optional-dependencies]
data = ["huggingface_hub", "pyarrow"]
wandb = ["wandb"]
analysis = ["pandas", "matplotlib", "scipy"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
