# The unit run. Every ablation inherits this file and changes exactly one thing.
# Architecture: deliberately vanilla (GPT-2 style), so each modification is measured
# against the same reference point Narang et al. (2021) used.
name: baseline
notes: GPT-2-style pre-LN transformer, ~25M non-embedding params, 600M tokens.

model:
  n_layer: 8
  d_model: 512
  n_head: 8              # d_head = 64
  n_kv_head: null        # MHA
  max_seq_len: 1024
  pos_type: learned
  ffn_type: gelu
  ffn_mult: 4.0          # 2 * 4 * d^2 FFN weights; gated FFNs get hidden = (2/3) * 4d
  norm_type: layernorm
  norm_position: pre
  final_norm: true
  qk_norm: false
  bias: false
  tie_embeddings: true
  init_std: 0.02
  scale_residual_init: true

train:
  data_dir: data/fineweb_edu/bpe_8192
  seed: 0
  data_seed: 0
  data_order: shuffled
  seq_len: 1024
  tokens_per_step: 524288     # 512 windows; constant across every run
  total_tokens: 600000000     # -> 1144 steps
  optimizer: adamw
  lr: 3.0e-3                  # placeholder until the baseline LR sweep (week 6)
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0
  schedule: cosine
  warmup_steps: 250
  min_lr_ratio: 0.1
  dtype: bf16
  eval_tokens: 2097152
  final_eval_tokens: null     # whole val_iid (~10M tokens)
  # operational
  micro_batch_size: 32
  compile: true
  eval_interval: 100
  log_interval: 10
  diag_interval: 100
  ckpt_interval: 100
